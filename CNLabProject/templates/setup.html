{% extends "base.html" %}
{% block login_content %}
<div class="glass-card rounded-2xl p-8 w-full shadow-xl">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">Set Up ChildSafe</h1>
    <p class="text-center text-slate-500 mb-8 text-sm">Create the parent password used to manage protection.</p>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Parent password</label>
            <input type="password" name="password" placeholder="Minimum 8 characters" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg" minlength="8" required autofocus>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Confirm password</label>
            <input type="password" name="confirmation" placeholder="Repeat password" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg" minlength="8" required>
        </div>
        <button type="submit" class="w-full py-2.5 px-4 rounded-lg text-white bg-primary-600 hover:bg-primary-700">Activate Parent Dashboard</button>
    </form>
</div>
{% endblock %}
