name: build-windows-application
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - run: python -m unittest discover -s CNLabProject/tests -v
      - name: Build executables
        shell: powershell
        run: .\packaging\build.ps1 -SkipInstaller
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\ChildSafe.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ChildSafe-Windows-Installer
          path: installer-output/ChildSafe-Setup.exe
          if-no-files-found: error